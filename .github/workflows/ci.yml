name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ddds
          POSTGRES_PASSWORD: ddds-dev
          POSTGRES_DB: ddds_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ddds" --health-interval 2s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://ddds:ddds-dev@localhost:5432/ddds_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run pytest for each component
        run: |
          for d in schemas fusion backend; do
            echo "=== $d ==="
            pip install -r "$d/requirements.txt"
            (cd "$d" && pytest -v)
          done

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run frontend tests
        run: |
          if [ -f frontend/package.json ]; then
            cd frontend && npm ci && npm test
          else
            echo "No frontend yet, skipping."
          fi
