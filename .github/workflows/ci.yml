name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run pytest for team components
        run: |
          pip install pytest
          found=0
          for d in schemas fusion backend edge-cv; do
            if [ -f "$d/requirements.txt" ]; then pip install -r "$d/requirements.txt"; fi
            if ls $d/tests/*.py >/dev/null 2>&1; then found=1; pytest "$d/tests"; fi
          done
          if [ $found -eq 0 ]; then echo "No tests yet, skipping."; fi

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run frontend tests
        run: |
          if [ -f frontend/package.json ]; then
            cd frontend && npm ci && npm test -- --watchAll=false
          else
            echo "No frontend yet, skipping."
          fi
